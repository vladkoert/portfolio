<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio — Vlad Koert | Brand Design, Photography &amp; Web Projects</title>
  <meta name="description" content="Browse Vlad Koert's portfolio: brand identity systems, editorial photography, web design and motion/3D projects." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://vladkoert.com/portfolio" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vlad Koert" />
  <meta property="og:title" content="Portfolio — Vlad Koert" />
  <meta property="og:description" content="Selected projects in brand identity, photography, web design and motion/3D." />
  <meta property="og:url" content="https://vladkoert.com/portfolio" />
  <meta property="og:image" content="https://vladkoert.com/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Portfolio — Vlad Koert" />
  <meta name="twitter:image" content="https://vladkoert.com/og-image.jpg" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="portfolio-page">
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/">Vlad Koert</a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/portfolio" class="active">Portfolio</a>
        <a href="/contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <div class="theme-toggle" aria-label="Toggle colour theme">
          <span data-mode="dark" title="Dark mode">●</span>
          <span data-mode="light" title="Light mode">○</span>
        </div>
        <a class="btn btn-solid" href="/contact">Contact me</a>
        <button class="menu-btn" aria-label="Toggle menu">≡</button>
      </div>
    </div>
  </header>

  <main class="portfolio-stage-wrap">
    <div class="portfolio-stage">

      <!-- Left: featured project with image carousel -->
      <div class="pf-featured">
        <div class="pf-carousel" id="pfCarousel">
          <img class="pf-slide active" src="/images/Photography/Wrestling/web/wrestling-02.jpg" alt="Wrestling — 1" />
          <img class="pf-slide" src="/images/Photography/Wrestling/web/wrestling-03.jpg" alt="Wrestling — 2" />
          <img class="pf-slide" src="/images/Photography/Wrestling/web/wrestling-04.jpg" alt="Wrestling — 3" />
          <img class="pf-slide" src="/images/Photography/Wrestling/web/wrestling-05.jpg" alt="Wrestling — 4" />
          <img class="pf-slide" src="/images/Photography/Wrestling/web/wrestling-06.jpg" alt="Wrestling — 5" />
          <img class="pf-slide" src="/images/Photography/Wrestling/web/wrestling-07.jpg" alt="Wrestling — 6" />
          <img class="pf-slide" src="/images/Photography/Wrestling/web/wrestling-08.jpg" alt="Wrestling — 7" />
          <button class="pf-arrow pf-prev" aria-label="Previous">&#8592;</button>
          <button class="pf-arrow pf-next" aria-label="Next">&#8594;</button>
          <div class="pf-label">
            <a href="/portfolio/wrestling">Wrestling <span>— View project →</span></a>
          </div>
          <div class="pf-dots" id="pfDots"></div>
        </div>
      </div>

      <!-- Right: project grid (mixed sizes) -->
      <div class="pf-grid">

        <a class="pf-tile pf-tile--tall" href="/portfolio/wrestling">
          <img src="/images/Photography/Wrestling/web/wrestling-01.jpg" alt="Wrestling" />
          <div class="pf-tile-label"><span>Wrestling</span><em>Photography</em></div>
        </a>

        <a class="pf-tile pf-tile--short" href="#">
          <div class="ph"><span class="ph-label">Brand identity</span></div>
          <div class="pf-tile-label"><span>Northline</span><em>Design</em></div>
        </a>

        <a class="pf-tile pf-tile--short" href="#">
          <div class="ph"><span class="ph-label">Web & product</span></div>
          <div class="pf-tile-label"><span>Atlas</span><em>Web</em></div>
        </a>

        <a class="pf-tile pf-tile--wide" href="#">
          <div class="ph ph-landscape"><span class="ph-label">Editorial layout</span></div>
          <div class="pf-tile-label"><span>Field Notes</span><em>Print</em></div>
        </a>

        <a class="pf-tile pf-tile--short" href="#">
          <div class="ph"><span class="ph-label">3D & motion</span></div>
          <div class="pf-tile-label"><span>Surface</span><em>3D</em></div>
        </a>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="footer-note">© 2026 Vlad Koert — Digital creative &amp; photographer.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
